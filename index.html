<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroSteer Arena</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #ff0040; --secondary: #00ffff; --bg: #87ceeb; }
        body { background: var(--bg); overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        #video { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 75% of previous size (was max 70px, now max 52px) */
        #wheel-container { 
            position: fixed; 
            width: clamp(32px, 9vw, 52px); 
            height: clamp(32px, 9vw, 52px); 
            right: 18px; 
            bottom: 18px; 
            left: auto; 
            top: auto; 
            z-index: 1000; 
            pointer-events: none; 
        }
        #wheel-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.7)); transition: transform 0.05s linear; }
        #hand-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
        .spinner { border: 2px solid rgba(255, 0, 64, 0.2); border-top: 2px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        #load-text { color: #666; font-size: 12px; letter-spacing: 2px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="load-text">INITIALIZING ARENA...</div>
    </div>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
    
    <div id="wheel-container">
        <img id="wheel-svg" src="wheel.svg" alt="Steering Wheel">
        <canvas id="hand-overlay" width="128" height="128"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
    
    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const video = document.getElementById('video');
        const handOverlay = document.getElementById('hand-overlay');
        const handCtx = handOverlay.getContext('2d');
        let W = window.innerWidth, H = window.innerHeight;

        // --- Three.js Scene ---
        const scene = new THREE.Scene();
        
        // Sky Atmosphere (Gradient)
        const skyGeo = new THREE.SphereGeometry(500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: { topColor: { value: new THREE.Color(0x0077ff) }, bottomColor: { value: new THREE.Color(0xffffff) }, offset: { value: 33 }, exponent: { value: 0.6 } },
            vertexShader: `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition + offset).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0); }`,
            side: THREE.BackSide
        });
        scene.add(new THREE.Mesh(skyGeo, skyMat));
        scene.fog = new THREE.Fog(0xffffff, 100, 400);

        const camera = new THREE.PerspectiveCamera(65, W / H, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
        renderer.setSize(W, H); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        // Sunny Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffee, 1.5);
        sun.position.set(50, 100, 50); sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // --- Stadium Oval Track ---
        const trackInner = 30;
        const trackOuter = 45;
        
        // Ground (Grass)
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 1.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        // Track (Asphalt Ring)
        const trackGeo = new THREE.RingGeometry(trackInner, trackOuter, 64);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x333335, roughness: 0.9, side: THREE.DoubleSide });
        const trackMesh = new THREE.Mesh(trackGeo, trackMat);
        trackMesh.rotation.x = -Math.PI / 2; trackMesh.position.y = 0.01; trackMesh.receiveShadow = true; scene.add(trackMesh);
        
        // Inner Kerb
        const innerKerbGeo = new THREE.RingGeometry(trackInner - 1, trackInner, 64);
        const innerKerbMat = new THREE.MeshStandardMaterial({ color: 0xff0040, side: THREE.DoubleSide });
        const innerKerb = new THREE.Mesh(innerKerbGeo, innerKerbMat);
        innerKerb.rotation.x = -Math.PI / 2; innerKerb.position.y = 0.02; scene.add(innerKerb);
        
        // Outer Kerb
        const outerKerbGeo = new THREE.RingGeometry(trackOuter, trackOuter + 1, 64);
        const outerKerb = new THREE.Mesh(outerKerbGeo, innerKerbMat);
        outerKerb.rotation.x = -Math.PI / 2; outerKerb.position.y = 0.02; scene.add(outerKerb);

        // Simple Grandstands
        const standMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        for(let i=0; i<8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const standGeo = new THREE.BoxGeometry(15, 5, 8);
            const stand = new THREE.Mesh(standGeo, standMat);
            stand.position.set(Math.cos(angle) * (trackOuter + 15), 2.5, Math.sin(angle) * (trackOuter + 15));
            stand.rotation.y = -angle;
            stand.castShadow = true; stand.receiveShadow = true;
            scene.add(stand);
        }

        // --- F1 Car ---
        const loader = new GLTFLoader();
        let carModel = null, carWheels = [];
        let carHeight = 1.0, carLength = 4.0, carWidth = 1.0;

        loader.load('assets/scene.gltf', (gltf) => {
            carModel = gltf.scene; carModel.scale.set(1, 1, 1); 
            carModel.traverse(obj => { if(obj.isMesh) { obj.castShadow = true; if(obj.name.toLowerCase().includes('wheel')||obj.name.toLowerCase().includes('tire')) carWheels.push(obj); } });
            
            // Dimensions
            let box = new THREE.Box3().setFromObject(carModel); 
            let size = new THREE.Vector3(); box.getSize(size);
            carLength = Math.max(size.z, 1);
            carHeight = Math.max(size.y, 1);
            carWidth = Math.max(size.x, 1);
            
            // Place on track
            carModel.position.set(0, 0, -trackInner - (trackOuter-trackInner)/2);
            scene.add(carModel);
            
            document.getElementById('loader').style.display = 'none';
        });

        // --- Game State ---
        let speed = 0.5; // Constant cruising speed
        let steeringInput = 0, targetSteering = 0;
        let currentWheelRotation = 0, targetWheelRotation = 0;

        // --- MediaPipe ---
        let hands;
        function initHands() {
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
            hands.onResults(onResults); startCamera();
        }
        async function startCamera() {
            try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } }); video.srcObject = stream; await video.play(); processFrame(); }
            catch(e) { console.error(e); }
        }
        async function processFrame() { if (video.readyState >= 2) await hands.send({ image: video }); requestAnimationFrame(processFrame); }

        function onResults(results) {
            handCtx.clearRect(0, 0, handOverlay.width, handOverlay.height);
            if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                const handsArr = results.multiHandLandmarks;
                let h0 = handsArr[0], h1 = handsArr[1];
                if (h0[0].x > h1[0].x) { h1 = handsArr[0]; h0 = handsArr[1]; }
                
                const dx = h1[0].x - h0[0].x, dy = h1[0].y - h0[0].y;
                const angle = Math.atan2(dy, dx);
                
                targetSteering = Math.abs(angle) < 0.1 ? 0 : Math.max(-1, Math.min(1, -angle / (Math.PI / 4)));
                targetWheelRotation = targetSteering * (Math.PI / 2);
                
                drawHandsOnWheel(handsArr);
            } else { 
                targetSteering = 0; 
                targetWheelRotation = 0; 
            }
        }

        function drawHandsOnWheel(handsArr) {
            const cx = handOverlay.width / 2, cy = handOverlay.height / 2;
            let minX = 1, maxX = 0, minY = 1, maxY = 0;
            handsArr.forEach(h => h.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }));
            let scale = 60 / Math.max(0.01, Math.max(maxX - minX, maxY - minY));
            let midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
            handCtx.save(); handCtx.translate(cx, cy); handCtx.rotate(currentWheelRotation);
            const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
            handsArr.forEach(h => {
                handCtx.strokeStyle = 'rgba(0, 255, 255, 0.9)'; handCtx.lineWidth = 2; handCtx.shadowColor = '#00ffff'; handCtx.shadowBlur = 3; handCtx.beginPath();
                connections.forEach(([a, b]) => { handCtx.moveTo((h[a].x - midX) * scale, (h[a].y - midY) * scale); handCtx.lineTo((h[b].x - midX) * scale, (h[b].y - midY) * scale); });
                handCtx.stroke();
                handCtx.fillStyle = '#ff0040'; handCtx.shadowColor = '#ff0040'; handCtx.shadowBlur = 2;
                h.forEach(pt => { handCtx.beginPath(); handCtx.arc((pt.x - midX) * scale, (pt.y - midY) * scale, Math.max(1, 2 - (pt.z + 0.1) * 10), 0, Math.PI * 2); handCtx.fill(); });
            });
            handCtx.restore();
        }

        // --- Game Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(0.05, clock.getDelta());
            const raceTime = clock.elapsedTime;
            
            if (carModel) {
                // Steering Smoothing
                steeringInput += (targetSteering - steeringInput) * 0.15;
                currentWheelRotation += (targetWheelRotation - currentWheelRotation) * 0.15;
                document.getElementById('wheel-svg').style.transform = `rotate(${currentWheelRotation}rad)`;
                
                // Car Physics (Constant speed, turning changes heading)
                // Model points -Z by default. We rotate it around Y to steer.
                carModel.rotation.y += steeringInput * delta * 1.5; // Turn rate
                
                // Forward vector based on current rotation
                const forward = new THREE.Vector3(0, 0, -1).applyEuler(carModel.rotation);
                carModel.position.addScaledVector(forward, speed * delta * 60);
                
                // Keep car on the track (Simple boundary check)
                const distFromCenter = Math.hypot(carModel.position.x, carModel.position.z);
                const trackMid = (trackInner + trackOuter) / 2;
                if (distFromCenter < trackInner + 1 || distFromCenter > trackOuter - 1) {
                    // Pull back to center gently if off track
                    const angle = Math.atan2(carModel.position.z, carModel.position.x);
                    carModel.position.x = Math.cos(angle) * trackMid;
                    carModel.position.z = Math.sin(angle) * trackMid;
                    speed = Math.max(0.2, speed - delta * 0.5); // Slow down on grass
                } else {
                    speed = Math.min(0.5, speed + delta * 0.5); // Restore speed on track
                }
                
                // Wheels rotation
                carWheels.forEach(w => w.rotation.x += speed * delta * 30);
                
                // --- TRUE THIRD-PERSON CHASE CAMERA ---
                const cameraTarget = new THREE.Vector3();
                cameraTarget.copy(carModel.position);
                cameraTarget.y += carHeight * 0.35;
                
                // Calculate desired camera pos based on car bounds and rotation
                // Offset is (0, Height*1.6 + 1.5, Length*2.8 + 5.0) in local space
                const offset = new THREE.Vector3(0, carHeight * 1.6 + 1.5, carLength * 2.8 + 5.0);
                offset.applyEuler(carModel.rotation); // Rotate offset by car's heading
                const desiredCameraPosition = new THREE.Vector3().copy(carModel.position).add(offset);
                
                // Subtle shake
                const shakeStrength = Math.max(0, (speed * 340) - 150) * 0.0015;
                desiredCameraPosition.x += Math.sin(raceTime * 31.0) * shakeStrength;
                desiredCameraPosition.y += Math.cos(raceTime * 37.0) * shakeStrength * 0.6;
                
                camera.position.lerp(desiredCameraPosition, 1 - Math.exp(-7.0 * delta));
                camera.lookAt(cameraTarget);
            }
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { W = window.innerWidth; H = window.innerHeight; camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H); });
        
        if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        initHands();
        animate();
    </script>
</body>
</html>
